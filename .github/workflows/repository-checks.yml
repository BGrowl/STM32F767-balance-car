name: Repository integrity

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  source-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source paths, documentation links and Python syntax
        run: python tools/check_repository.py
